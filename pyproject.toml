[project]
name = "ccsessions"
version = "0.1.0"
description = "Terminal browser for Claude Code sessions in ~/.claude/projects"
authors = [
    { name = "MDGCAT", email = "michael@iguillory.com" }
]
requires-python = ">=3.9"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
ccsessions = "ccsessions.app:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
